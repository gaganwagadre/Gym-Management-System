name: Expo EAS Build

on:
  push:
    branches: ["main"]

jobs:
  eas-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Expo Login
        run: eas login -u YOUR_EXPO_USERNAME -p YOUR_EXPO_PASSWORD

      - name: Build Android
        run: eas build -p android --non-interactive
